type Chat {
  id: String!
  title: String!
  jobIds: [String!]!
  history: [ChatMessage!]!
  createdAt: String!
}

type Job {
  id: String!
  url: String!
  type: String!
  status: String!
  result: String
  createdAt: String!
}

type Stats {
  totalJobs: Int!
  queuedJobs: Int!
  doneJobs: Int!
  failedJobs: Int!
}

type ChatMessage {
  role: String!
  text: String!
}

type SiteTrainResult {
  engine: String!
  pageCount: Int!
  artifactPath: String
  confidence: Float
  warnings: [String!]
}

type SiteAskResult {
  answer: String!
  citations: [String!]
  confidence: Float
  snippet: String
}

input CreateJobInput {
  url: String!
  type: String!
  text: String
  selector: String
  forceRefresh: Boolean
}

type Query {
  jobs: [Job!]!
  stats: Stats!
  askSite(jobId: String, url: String!, question: String!, topK: Int): SiteAskResult!
  getChatHistory(jobId: String!): [ChatMessage!]!
  chats: [Chat!]!
  getChat(id: String!): Chat
}

type Mutation {
  createJob(input: CreateJobInput!): Job!
  crawlAndTrainSite(url: String!, maxPages: Int, maxDepth: Int): SiteTrainResult!
  deleteJob(id: String!): Boolean!
  createChat(title: String!, jobIds: [String!]!): Chat!
  addJobsToChat(chatId: String!, jobIds: [String!]!): Chat!
  deleteChat(id: String!): Boolean!
  clearJobChat(jobId: String!): Boolean!
  clearWorkspaceChat(chatId: String!): Boolean!
}